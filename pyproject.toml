[project]
name = "f1-skill"
version = "0.1.0"
description = "How much of an F1 result is driver vs. car? A Bayesian decomposition, 2018-2025."
requires-python = ">=3.12"
dependencies = [
    "fastf1",
    "pandas",
    "numpy",
    "bambi",
    "pymc",
    "arviz",
    "lightgbm",
    "shap",
    "scikit-learn",
    "streamlit",
    "matplotlib",
    "scipy",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.ruff]
line-length = 100
# Notebooks are executed documents, not library code. Reformatting a cell would leave its stored
# output describing source that no longer exists, which is the staleness the analysis is careful
# about, and import order inside a notebook that runs top to bottom is not a defect worth that.
extend-exclude = ["notebooks", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_skill"]
