[project]
name = "f1-skill"
version = "0.1.0"
description = "How much of an F1 result is driver vs. car? A Bayesian decomposition, 2018-2025."
requires-python = ">=3.12"
dependencies = [
    "fastf1",
    "pandas",
    "numpy",
    "bambi",
    "pymc",
    "arviz",
    "lightgbm",
    "shap",
    "scikit-learn",
    "streamlit",
    "matplotlib",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_skill"]
